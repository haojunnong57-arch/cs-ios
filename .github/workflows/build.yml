name: Build CS 1.6 iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    env:
      # yapb 的编译选项脚本把 iOS 当成 macOS：会塞 -mmacosx-version-min / -msse / -march=x86-64，
      # 和 iOS 工具链的 -miphoneos-version-min 直接冲突。这里统一由本文件修补，不依赖上游。
      CS16_REPO: https://github.com/Velaron/cs16-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -eo pipefail
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --show-sdk-path
            sw_vers
            cmake --version | head -1
          } 2>&1 | tee build.log

      - name: Clone cs16-client
        run: |
          set -eo pipefail
          {
            git clone --depth 1 --recursive "$CS16_REPO" mods/cs16-client
            echo "cs16:  $(git -C mods/cs16-client rev-parse --short HEAD)"
            echo "yapb:  $(git -C mods/cs16-client/3rdparty/yapb rev-parse --short HEAD)"
          } 2>&1 | tee -a build.log

      - name: Patch third-party for iOS
        run: |
          set -eo pipefail
          {
            FLAGS=mods/cs16-client/3rdparty/yapb/cmake/YapbFlags.cmake
            echo "--- before:"; grep -n "elseif(APPLE)" "$FLAGS"
            # iOS 不是 macOS：整段 APPLE 分支只能给桌面 Darwin 用
            python3 - "$FLAGS" <<'PY'
import sys, io
p = sys.argv[1]
s = open(p, encoding='utf-8').read()
old = 'elseif(APPLE)'
new = 'elseif(APPLE AND NOT CMAKE_SYSTEM_NAME MATCHES "iOS")'
assert old in s, 'APPLE branch not found'
s = s.replace(old, new, 1)
open(p, 'w', encoding='utf-8').write(s)
print('patched:', new)
PY
            echo "--- after:"; grep -n "elseif(APPLE" "$FLAGS"
          } 2>&1 | tee -a build.log

      - name: Configure cs16-client for iOS arm64
        run: |
          set -eo pipefail
          {
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            cd mods/cs16-client
            cmake -S . -B build \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_SYSTEM_PROCESSOR=arm64 \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_SYSROOT="$SDK" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -DYAPB_NOSIMD=ON \
              -DMAC=0 -DXASH_COMPAT=1 -DMAINUI_USE_STB=1
          } 2>&1 | tee -a ../../build.log
        working-directory: .

      - name: Build cs16-client
        run: |
          set -eo pipefail
          {
            cd mods/cs16-client
            cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"
          } 2>&1 | tee -a ../../build.log

      - name: Install cstrike payload
        run: |
          set -eo pipefail
          {
            cd mods/cs16-client
            rm -rf ../../stage
            cmake --install build --prefix "$PWD/../../stage"
            echo "--- stage tree"
            find ../../stage -maxdepth 4 -type f | head -60
            echo "--- dylibs"
            find ../../stage -name '*.dylib' -exec sh -c 'echo "$1"; file "$1"' _ {} \;
          } 2>&1 | tee -a ../../build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-ios-build
          path: |
            build.log
            stage/
          if-no-files-found: warn
          retention-days: 30
